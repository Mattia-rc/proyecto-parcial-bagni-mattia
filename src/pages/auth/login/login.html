<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Store | Iniciar sesión</title>
  <link rel="preconnect" href="https://images.unsplash.com" />
  <link rel="stylesheet" href="./login.css" />
</head>
<body>
  <main class="login-page">
    <section class="login-card">
      <div class="brand">
        <span>🍕</span>
        <strong>Food Store</strong>
      </div>

      <h1>Iniciar sesión</h1>
      <p class="subtitle">Ingresá como cliente para ver el catálogo y armar tu carrito.</p>

      <form id="form" class="form">
        <div class="field">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="off"
            placeholder="cliente@foodstore.com"
            required
          />
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="off"
            placeholder="********"
            required
          />
        </div>

        <div class="field">
          <label for="rol">Rol</label>
          <select name="rol" id="rol" required>
            <option value="">Seleccione un rol</option>
            <option value="client">Cliente</option>
            <option value="admin">Admin</option>
          </select>
        </div>

        <button type="submit" class="login-button">Ingresar</button>
      </form>

      <p class="hint">Tip para el video: elegí rol <strong>Cliente</strong> para mostrar el parcial.</p>
    </section>

    <section class="image-panel">
      <div class="image-content">
        <span>Parcial Programación III</span>
        <h2>Frontend dinámico con TypeScript</h2>
        <p>Catálogo, filtros, búsqueda y carrito persistente con localStorage.</p>
      </div>
    </section>
  </main>

  <script type="module" src="./login.ts"></script>
</body>
</html>
